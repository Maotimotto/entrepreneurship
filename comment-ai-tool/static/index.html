<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>评论AI — 控制台</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0f1117;--s1:#1a1d27;--s2:#242836;--bd:#2e3347;--t1:#e4e4e7;--t2:#9ca3af;--a1:#6366f1;--a2:#818cf8;--cy:#22d3ee;--gn:#10b981;--yl:#f59e0b;--rd:#ef4444}
    body{font-family:'SF Pro',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}

    .hdr{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
    .hdr h1{font-size:17px;font-weight:700}.hdr h1 span{color:var(--cy)}
    .hdr .st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2)}
    .hdr .dot{width:6px;height:6px;border-radius:50%;background:var(--gn);animation:pls 2s infinite}
    @keyframes pls{0%,100%{opacity:1}50%{opacity:.4}}

    .wrap{max-width:900px;margin:0 auto;padding:16px}

    /* 流程图 */
    .flow{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}
    .flow-step{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;font-size:12px;font-weight:600;text-align:center;min-width:100px}
    .flow-step .icon{font-size:18px;margin-bottom:4px}
    .flow-arrow{color:var(--t2);font-size:16px}

    /* Stats */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
    .stat{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px}
    .stat .lb{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
    .stat .vl{font-size:26px;font-weight:700;letter-spacing:-1px}
    .stat .vl.a{color:var(--a2)}.stat .vl.c{color:var(--cy)}.stat .vl.g{color:var(--gn)}.stat .vl.y{color:var(--yl)}

    /* Actions */
    .act{display:flex;gap:8px;margin:14px 0}
    .btn{padding:8px 16px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
    .btn-p{background:var(--a1);color:#fff}.btn-p:hover{background:var(--a2)}
    .btn-g{background:transparent;color:var(--t2);border:1px solid var(--bd)}.btn-g:hover{border-color:var(--a1);color:var(--t1)}
    .btn:disabled{opacity:.4;cursor:not-allowed}

    /* Feed */
    .feed{display:grid;gap:10px}
    .card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow:hidden;animation:su .3s ease-out both}
    .card:hover{border-color:var(--a1)}
    @keyframes su{from{opacity:0;transform:translateY(8px)}}

    .ct{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
    .cu{display:flex;align-items:center;gap:8px}
    .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
    .un{font-size:12px;font-weight:600}
    .bd{padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700}
    .bd-h{background:rgba(99,102,241,.2);color:var(--a2)}.bd-m{background:rgba(245,158,11,.15);color:var(--yl)}.bd-l{background:rgba(156,163,175,.1);color:var(--t2)}

    .cb{padding:0 14px 10px}
    .ct-text{font-size:13px;line-height:1.55;margin-bottom:8px}
    .tags{display:flex;gap:5px;flex-wrap:wrap}
    .tg{font-size:9px;padding:2px 6px;border-radius:3px}
    .tg-i{background:rgba(99,102,241,.12);color:var(--a2)}
    .tg-u{background:rgba(239,68,68,.12);color:var(--rd)}
    .tg-k{background:rgba(34,211,238,.12);color:var(--cy)}

    .rp{margin:0 14px 12px;padding:8px 12px;background:var(--s2);border-radius:6px;border-left:2px solid var(--gn)}
    .rp .lb{font-size:9px;color:var(--gn);font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
    .rp .tx{font-size:12px;line-height:1.45}

    .empty{text-align:center;padding:48px 16px;color:var(--t2)}
    .empty .ic{font-size:36px;margin-bottom:10px}
    .empty p{font-size:13px;max-width:340px;margin:0 auto;line-height:1.55}

    .ld{text-align:center;padding:36px;color:var(--t2)}
    .sp{display:inline-block;width:24px;height:24px;border:2px solid var(--bd);border-top-color:var(--a1);border-radius:50%;animation:spn .7s linear infinite;margin-bottom:8px}
    @keyframes spn{to{transform:rotate(360deg)}}

    @media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.flow{flex-direction:column}.flow-arrow{transform:rotate(90deg)}}
  </style>
</head>
<body>
  <div class="hdr">
    <h1>评论<span>AI</span></h1>
    <div class="st"><div class="dot"></div> v0.1.3</div>
  </div>

  <div class="wrap">
    <!-- 流程图 -->
    <div class="flow">
      <div class="flow-step"><div class="icon">📱</div>评论采集</div>
      <div class="flow-arrow">→</div>
      <div class="flow-step"><div class="icon">🧠</div>AI意图分析</div>
      <div class="flow-arrow">→</div>
      <div class="flow-step"><div class="icon">🎯</div>潜客筛选</div>
      <div class="flow-arrow">→</div>
      <div class="flow-step"><div class="icon">💬</div>智能回复</div>
      <div class="flow-arrow">→</div>
      <div class="flow-step"><div class="icon">📊</div>私域建档</div>
    </div>

    <div class="stats">
      <div class="stat"><div class="lb">评论</div><div class="vl a" id="sT">—</div></div>
      <div class="stat"><div class="lb">潜客</div><div class="vl c" id="sL">—</div></div>
      <div class="stat"><div class="lb">回复</div><div class="vl g" id="sR">—</div></div>
      <div class="stat"><div class="lb">转化率</div><div class="vl y" id="sP">—</div></div>
    </div>

    <div class="act">
      <button class="btn btn-p" onclick="run()" id="rBtn">▶ 运行演示</button>
      <button class="btn btn-g" onclick="clr()">清空</button>
    </div>

    <div class="feed" id="fd">
      <div class="empty"><div class="ic">💬</div><p>点击「运行演示」查看 AI 如何识别评论意图、筛选潜客、生成回复</p></div>
    </div>
  </div>

  <script>
    const C=['#6366f1','#22d3ee','#10b981','#f59e0b','#ef4444','#a78bfa','#f472b6','#34d399','#fbbf24','#fb923c'];
    async function run(){
      const b=document.getElementById('rBtn');b.disabled=true;b.textContent='⏳ 分析中...';
      document.getElementById('fd').innerHTML='<div class="ld"><div class="sp"></div><div>AI 正在分析...</div></div>';
      try{
        const r=await fetch('/api/v1/demo/run',{method:'POST'}),d=await r.json();
        document.getElementById('sT').textContent=d.total_comments;
        document.getElementById('sL').textContent=d.leads_found;
        document.getElementById('sR').textContent=d.replies_generated;
        document.getElementById('sP').textContent=d.total_comments?Math.round(d.leads_found/d.total_comments*100)+'%':'0%';
        const f=document.getElementById('fd');f.innerHTML='';
        d.results.forEach((x,i)=>{
          const el=document.createElement('div');el.className='card';el.style.animationDelay=`${i*.05}s`;
          const sc=x.score>=.7?'bd-h':x.score>=.4?'bd-m':'bd-l';
          const sl=x.score>=.7?'🔥 高意向':x.score>=.4?'👀 中意向':'💤 低意向';
          el.innerHTML=`
            <div class="ct"><div class="cu"><div class="av" style="background:${C[i%10]}">${x.author[0]}</div><div class="un">${x.author}</div></div><div class="bd ${sc}">${sl} ${(x.score*100).toFixed(0)}分</div></div>
            <div class="cb"><div class="ct-text">${x.comment}</div><div class="tags"><span class="tg tg-i">${x.intent}</span><span class="tg tg-u">${x.urgency}</span>${x.keywords.map(k=>`<span class="tg tg-k">${k}</span>`).join('')}</div></div>
            ${x.reply?`<div class="rp"><div class="lb">💬 AI 回复</div><div class="tx">${x.reply}</div></div>`:''}`;
          f.appendChild(el);
        });
      }catch(e){document.getElementById('fd').innerHTML=`<div class="empty"><div class="ic">⚠️</div><p>${e.message}</p></div>`}
      finally{b.disabled=false;b.textContent='▶ 运行演示'}
    }
    function clr(){document.getElementById('fd').innerHTML='<div class="empty"><div class="ic">💬</div><p>点击「运行演示」开始</p></div>';['sT','sL','sR','sP'].forEach(i=>document.getElementById(i).textContent='—')}
  </script>
</body>
</html>
