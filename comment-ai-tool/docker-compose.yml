# comment-ai-tool 独立部署
# 用法: docker compose up -d
# 与 MoneyPrinterTurbo 联合部署: 用上层 ~/projects/docker-compose.yml

services:
  mysql:
    image: mysql:8.0
    container_name: comment-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-comment_ai_pass}
      MYSQL_DATABASE: comment_ai
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: comment-ai-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: mysql+aiomysql://root:***@mysql:3306/comment_ai
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      MPT_BASE_URL: ${MPT_BASE_URL:-http://localhost:8080}
      MPT_ENABLED: ${MPT_ENABLED:-false}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-300}
      MIN_LEAD_SCORE: ${MIN_LEAD_SCORE:-0.6}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data

volumes:
  mysql_data:
  app_data:
